<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="./style.css">

    <!-- Yandex Games SDK -->
    <script src="/sdk.js"></script>

    <style>
        canvas:focus {
            outline: none;
        }

        html, body {
            padding: 0;
            margin: 0;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: rgba(0,0,0,0);
            height: 100%;
        }
    </style>

    <!-- Additional head modules -->

</head>
<body class="{{{ SPLASH_SCREEN_STYLE.toLowerCase() }}}">

    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>
    <div id="loading-cover" style="display:none;">
        <div id="unity-loading-bar">
            <div id="unity-logo"><img src="Images/logo.png"></div>
            <div id="unity-progress-bar-empty" style="display: none;">
                <div id="unity-progress-bar-full"></div>
            </div>
            <div class="spinner"></div>
        </div>
    </div>

    <!-- Additional body modules -->

    <script>
        const hideFullScreenButton = "";
        const buildUrl = "Build";
        const loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
        const config = {
            dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
            frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
            codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
            #if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
            #endif
        #if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
            #endif
        streamingAssetsUrl: "StreamingAssets",
            companyName: "{{{ COMPANY_NAME }}}",
            productName: "{{{ PRODUCT_NAME }}}",
            productVersion: "{{{ PRODUCT_VERSION }}}"
        };

        const container = document.querySelector("#unity-container");
        const canvas = document.querySelector("#unity-canvas");
        const loadingCover = document.querySelector("#loading-cover");
        const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");
        const spinner = document.querySelector('.spinner');

        const canFullscreen = (function () {
            for (const key of [
                'exitFullscreen',
                'webkitExitFullscreen',
                'webkitCancelFullScreen',
                'mozCancelFullScreen',
                'msExitFullscreen',
            ]) {
                if (key in document) {
                    return true;
                }
            }
            return false;
        }());

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            container.className = "unity-mobile";
            //config.devicePixelRatio = 1;
        }

        // The background image when loading the game. When building a build, the code changes depending on the project settings.
#if BACKGROUND_FILENAME
        var backgroundUnity = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif
        loadingCover.style.background = "url('Images/background.png') center / cover";
        loadingCover.style.display = "";

        let StartUnityInstance;
        let ygGameInstance = null;
        let ysdk = null;
        let initYSDK = false;
        let initSDKMessageSent = false;
        let initGame = false;
        let syncInit = false;
        let isVisibility = true;
        let isPausedGame = false;
        const NO_DATA = 'no data';

        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('visibilitychange', () => SetVisibility(!document.hidden));
        window.addEventListener('blur', () => SetVisibility(false));
        window.addEventListener('focus', () => SetVisibility(true));

        window.addEventListener('pointerdown', () => {
            FocusGame();
            SetVisibility(true);
        });

        window.addEventListener('resize', () => FocusGame());
        document.addEventListener('fullscreenchange', () => FocusGame());

        const oRequestPointerLock = Element.prototype.requestPointerLock;
        Element.prototype.requestPointerLock = async function hkRequestPointerLock(...args) {
            try {
                (args[0] ||= {}).unadjustedMovement = true;
                await oRequestPointerLock.apply(this, args);
            } catch (err) {
                console.log(err);
            }
        };

        function InstallBlurFocusBlocker() {
            if (!('onblur' in document)) return;
            if (window.blurFocusHandlersInstalled) return;

            window.addEventListener('blur', function () {
                let blockerButton = document.createElement('button');
                blockerButton.style.position = 'fixed';
                blockerButton.style.top = '0';
                blockerButton.style.left = '0';
                blockerButton.style.width = '100%';
                blockerButton.style.height = '100%';
                blockerButton.style.zIndex = '9999';
                blockerButton.style.backgroundColor = 'rgba(0, 0, 0, 0)';
                blockerButton.style.border = 'none';
                blockerButton.style.cursor = 'default';

                document.body.appendChild(blockerButton);

                function removeBlocker() {
                    if (blockerButton && blockerButton.parentNode) {
                        blockerButton.parentNode.removeChild(blockerButton);
                    }
                    window.removeEventListener('focus', removeBlocker);
                }

                window.addEventListener('focus', removeBlocker);
            });

            window.blurFocusHandlersInstalled = true;
        }

        function FocusGame(checkingPauseStatus = true) {
            if (!canvas) return;

            requestAnimationFrame(() => {
                if (checkingPauseStatus && isPausedGame) return;

                const active = document.activeElement;
                if (active && (active.tagName === 'INPUT' ||
                    active.tagName === 'TEXTAREA' ||
                    active.isContentEditable
                )) {
                    return;
                }

                canvas.focus({ preventScroll: true });
            });
        }

        function SetVisibility(visibility) {
            if (ysdk !== null && initGame === true && isVisibility !== visibility) {
                isVisibility = visibility;
                if (!visibility) {
                    YG2Instance('SetFocusWindowGame', 'false');
                }
                else {
                    YG2Instance('SetFocusWindowGame', 'true');
                }
            }
        }

        const PauseCallback = () => {
            isPausedGame = true;
            YG2Instance('SetPauseGame', 'true');
        };

        const ResumeCallback = () => {
            isPausedGame = false;
            YG2Instance('SetPauseGame', 'false');
            FocusGame();
        };

        const script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            StartUnityInstance = function () {
                createUnityInstance(canvas, config, (progress) => {
                    spinner.style.display = "none";
                    progressBarEmpty.style.display = "";
                    const adjustedProgress = Math.max(progress, 0.05);
                    progressBarFull.style.width = `${100 * adjustedProgress}%`;
                }).then((unityInstance) => {
                    ygGameInstance = unityInstance;
                    SendInitSDKComplete();

                    loadingCover.style.background = "";
                    loadingCover.style.display = "none";
                    FocusGame();
                    // Fill Background [Build Modify]
                }).catch((message) => {
                    console.error(message);
                    ShowStartError();
                });
            };
            
            InstallBlurFocusBlocker();
            InitYSDK();
            
            if (IsLocalHost() || syncInit)
                StartUnityInstance_IfUnloaded();
        };

        function StartUnityInstance_IfUnloaded() {
            if (spinner.style.display !== "none")
                StartUnityInstance();
        }

        function IsLocalHost() {
            try {
                if (window.top !== window)
                    return false;

                const host = window.location.hostname;
                const isLocalAddress = window.location.protocol === "file:" ||
                    host === "localhost" ||
                    host === "127.0.0.1" ||
                    host === "::1" ||
                    host.endsWith(".local");

                if (isLocalAddress && !IsYandexSDKAvailable()) {
                    LogStyledMessage("Local Host Without Yandex SDK");
                    return true;
                }

                return false;
            }
            catch (error) {
                console.error("Error checking the local host:", error);
                return false;
            }
        }

        function IsYandexSDKAvailable() {
            return typeof YaGames !== "undefined" && typeof YaGames.init === "function";
        }

        function SendInitSDKComplete() {
            if (!initYSDK || ygGameInstance == null || initSDKMessageSent)
                return;

            ygGameInstance.SendMessage('YG2Instance', 'InitSDKComplete');
            initSDKMessageSent = true;
        }

        let pendingYG2Messages = [];
        let pendingYG2Timer = null;

        function YG2Instance(method, arg) {
            if (ygGameInstance == null)
                return;

            if (!initGame || pendingYG2Messages.length > 0) {
                pendingYG2Messages.push({ method: method, arg: arg });

                if (pendingYG2Timer === null)
                    pendingYG2Timer = setTimeout(FlushYG2Messages, 100);

                return;
            }

            SendYG2Message(method, arg);
        }

        function FlushYG2Messages() {
            pendingYG2Timer = null;

            const queue = pendingYG2Messages;
            pendingYG2Messages = [];

            if (ygGameInstance == null)
                return;

            for (let i = 0; i < queue.length; i++)
                SendYG2Message(queue[i].method, queue[i].arg);
        }

        function SendYG2Message(method, arg) {
            if (arg === undefined)
                ygGameInstance.SendMessage('YG2Instance', method);
            else
                ygGameInstance.SendMessage('YG2Instance', method, arg);
        }

        function LogStyledMessage(message, style = 'color: #FFDF73; background-color: #454545') {
            console.log('%c' + message, style);
        }

        async function InitYSDK() {
            try {
                if (IsLocalHost()) return;

                ysdk = await YaGames.init();
                ysdk.on('game_api_pause', PauseCallback);
                ysdk.on('game_api_resume', ResumeCallback);

                // Additional init0 modules

                // Additional init1 modules

                // Additional init2 modules

                // Additional init modules

                initYSDK = true;
                SendInitSDKComplete();

                LogStyledMessage('Init YandexSDK Success');

            } catch (e) {
                console.error('CRASH Initialization SDK: ', e);
            }

            if (!IsLocalHost() && !syncInit)
                StartUnityInstance_IfUnloaded();
        }

        function InitGame() {
            initGame = true;

            setTimeout(function () {
                if (isPausedGame == true)
                    YG2Instance('SetPauseGame', 'true');
            }, 0);

            // Additional start modules
        }


        // ---- Y4: ekran uyumu, kaydırma ve menü engelleri ----
        function ApplyAspectCap() {
            // Mobilde tüm ekran kullanılır; masaüstünde uzun kenar en fazla 2x kısa kenar (Yandex 1.6.2)
            if (container.className === 'unity-mobile') {
                container.style.width = '100%';
                container.style.height = '100%';
                return;
            }
            const w = window.innerWidth, h = window.innerHeight;
            let cw = w, ch = h;
            if (w > 2 * h) cw = 2 * h;
            else if (h > 2 * w) ch = 2 * w;
            container.style.width = cw + 'px';
            container.style.height = ch + 'px';
        }
        ApplyAspectCap();
        window.addEventListener('resize', ApplyAspectCap);
        window.addEventListener('orientationchange', () => setTimeout(ApplyAspectCap, 100));
        document.addEventListener('fullscreenchange', ApplyAspectCap);

        // Sayfa kaydırma / pull-to-refresh / pinch-zoom / çift dokunma yakınlaştırması kapalı
        document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
        ['gesturestart', 'gesturechange', 'gestureend'].forEach(t =>
            document.addEventListener(t, e => e.preventDefault(), { passive: false }));
        document.addEventListener('dblclick', e => e.preventDefault());

        // Metin seçimi ve sürükle-bırak kapalı (sağ tık menüsü zaten yukarıda kapalı)
        document.addEventListener('selectstart', e => e.preventDefault());
        document.addEventListener('dragstart', e => e.preventDefault());

        // Oyun odaktayken boşluk/ok/PageUp-Down tuşları sayfayı kaydırmasın
        const scrollKeys = ['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown', 'Home', 'End'];
        window.addEventListener('keydown', e => {
            const a = document.activeElement;
            if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.isContentEditable)) return;
            if (scrollKeys.indexOf(e.code) !== -1) e.preventDefault();
        }, { passive: false });

        // WebGL2/başlatma hatasında boş ekran yerine kısa mesaj (dil: RU/EN/TR)
        function ShowStartError() {
            const lang = (navigator.language || 'en').toLowerCase();
            const text = lang.startsWith('ru') ? 'Не удалось запустить игру. Обновите браузер.'
                : lang.startsWith('tr') ? 'Oyun başlatılamadı. Lütfen tarayıcınızı güncelleyin.'
                : 'The game could not start. Please update your browser.';
            loadingCover.style.background = '#000';
            loadingCover.style.display = 'flex';
            loadingCover.innerHTML = '<div style="color:#fff;font:16px sans-serif;text-align:center;padding:16px">' + text + '</div>';
        }

        // Additional script modules

        document.body.appendChild(script);
    </script>
</body>
</html>
